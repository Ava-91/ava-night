name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate all editions and shared base
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const entry of pkg.contributes.themes) {
            const themePath = path.resolve(entry.path);
            if (!fs.existsSync(themePath)) throw new Error('Missing theme: ' + entry.path);
            const theme = JSON.parse(fs.readFileSync(themePath, 'utf8'));
            if (theme.name !== entry.label) throw new Error('Theme label mismatch: ' + entry.label);
            if (theme.include) {
              const base = path.resolve(path.dirname(themePath), theme.include);
              if (!fs.existsSync(base)) throw new Error('Missing shared base for ' + entry.label);
              JSON.parse(fs.readFileSync(base, 'utf8'));
            }
          }
          NODE

      - name: Run diagnostics and QA
        run: |
          npm run diagnostics
          npm run quality
          npm run qa
          npm test
          npm run release:check

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package VSIX
        run: vsce package --no-dependencies

      - name: Verify packaged editions
        run: npm run vsix:smoke

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ava-night-vsix
          path: "*.vsix"

      - name: Attach VSIX to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.vsix --clobber
