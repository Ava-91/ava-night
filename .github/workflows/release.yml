name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag and metadata
        run: npm run release:check

      - name: Run theme and contrast gates
        run: |
          npm run diagnostics
          npm run quality
          npm run variants:check
          npm run qa
          npm test

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package VSIX
        run: vsce package --no-dependencies

      - name: Verify VSIX
        run: npm run vsix:smoke

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ava-night-vsix
          path: "*.vsix"

      - name: Attach VSIX to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.vsix --clobber
