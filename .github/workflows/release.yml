name: Release Build

on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm install -g @vscode/vsce

      - run: vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: ava-night-vsix
          path: "*.vsix"
