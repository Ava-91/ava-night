name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extension metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const theme = pkg.contributes?.themes?.find((entry) => entry.label === 'Ava Night');
          if (!theme) throw new Error('Ava Night theme contribution is missing.');
          if (theme.uiTheme !== 'vs-dark') throw new Error('Ava Night must use the vs-dark UI theme.');
          if (!fs.existsSync(theme.path)) throw new Error(`Theme file not found: ${theme.path}`);
          if (pkg.license !== 'MIT') throw new Error('Expected the MIT license.');
          console.log(`Validated ${theme.path} from package.json.`);
          NODE

      - name: Validate theme JSONC
        run: |
          node <<'NODE'
          const fs = require('fs');

          const parseJsonc = (source) => {
            let output = '';
            let inString = false;
            let escaped = false;
            let inLineComment = false;
            let inBlockComment = false;

            for (let i = 0; i < source.length; i++) {
              const char = source[i];
              const next = source[i + 1];

              if (inLineComment) {
                if (char === '\n') {
                  inLineComment = false;
                  output += char;
                }
                continue;
              }

              if (inBlockComment) {
                if (char === '*' && next === '/') {
                  inBlockComment = false;
                  i++;
                } else if (char === '\n') {
                  output += '\n';
                }
                continue;
              }

              if (inString) {
                output += char;
                if (escaped) escaped = false;
                else if (char === '\\') escaped = true;
                else if (char === '"') inString = false;
                continue;
              }

              if (char === '"') {
                inString = true;
                output += char;
              } else if (char === '/' && next === '/') {
                inLineComment = true;
                i++;
              } else if (char === '/' && next === '*') {
                inBlockComment = true;
                i++;
              } else {
                output += char;
              }
            }

            return JSON.parse(output.replace(/,\s*([}\]])/g, '$1'));
          };

          const themePath = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            .contributes.themes.find((entry) => entry.label === 'Ava Night').path;
          const source = fs.readFileSync(themePath, 'utf8');
          const parsed = parseJsonc(source);
          if (parsed.name !== 'Ava Night') throw new Error('Theme name does not match package metadata.');
          if (!parsed.include) throw new Error('Published theme must include the base theme.');
          const basePath = require('path').resolve(require('path').dirname(themePath), parsed.include);
          if (!fs.existsSync(basePath)) throw new Error(`Included base theme not found: ${parsed.include}`);
          parseJsonc(fs.readFileSync(basePath, 'utf8'));
          console.log('Validated published theme and included base theme as JSONC.');
          NODE

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package extension
        run: vsce package --no-dependencies
