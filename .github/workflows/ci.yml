name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extension metadata and every theme edition
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.license !== 'MIT') throw new Error('Expected the MIT license.');
          if (pkg.name !== 'ava-night') throw new Error('Unexpected extension package name.');
          if (pkg.icon !== 'icon.png' || !fs.existsSync(pkg.icon)) throw new Error('The Marketplace PNG icon is missing.');
          if (!Array.isArray(pkg.contributes?.themes) || pkg.contributes.themes.length < 4) throw new Error('Expected four selectable themes.');
          for (const entry of pkg.contributes.themes) {
            const themePath = path.resolve(entry.path);
            if (!fs.existsSync(themePath)) throw new Error(`Theme file missing: ${entry.path}`);
            const theme = JSON.parse(fs.readFileSync(themePath, 'utf8'));
            if (theme.name !== entry.label) throw new Error(`Theme label mismatch: ${entry.label} / ${theme.name}`);
            if (entry.uiTheme !== 'vs-dark') throw new Error(`Unexpected UI theme for ${entry.label}`);
          }
          console.log(`Validated metadata and ${pkg.contributes.themes.length} theme editions.`);
          NODE

      - name: Run diagnostics
        run: npm run diagnostics

      - name: Run theme quality checks
        run: npm run quality

      - name: Run theme-family and contrast checks
        run: npm run variants:check

      - name: Run full QA report
        run: npm run qa

      - name: Run tests
        run: npm test

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package VSIX
        run: vsce package --no-dependencies

      - name: Validate packaged extension
        run: npm run vsix:smoke

      - name: Install pinned VS Code runtime
        run: |
          curl -L --fail --retry 3 -o /tmp/code.deb https://update.code.visualstudio.com/1.100.0/linux-deb-x64/stable
          sudo apt-get update
          sudo apt-get install -y /tmp/code.deb xvfb

      - name: Resolve packaged VSIX path
        run: echo "VSIX_PATH=$GITHUB_WORKSPACE/ava-night-$(node -p "require('./package.json').version").vsix" >> "$GITHUB_ENV"

      - name: Install extension and launch VS Code smoke test
        env:
          CODE_BIN: code
        run: npm run vscode:smoke

      - name: Upload QA and smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ava-night-qa-reports
          path: |
            tests/results/*.json
            tests/results/*.md
