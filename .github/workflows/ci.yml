name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate theme JSON
        run: node -e "const fs=require('fs'); const files=['themes/Ava Night-color-theme.json','themes/Ava Night UI-refined-color-theme.json']; for (const f of files) JSON.parse(fs.readFileSync(f,'utf8')); console.log('Validated '+files.length+' theme files.')"

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package extension
        run: vsce package
