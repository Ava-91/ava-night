name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate theme JSONC
        run: |
          node <<'NODE'
          const fs = require('fs');

          const files = [
            'themes/Ava Night-color-theme.json',
            'themes/Ava Night UI-refined-color-theme.json'
          ];

          // VS Code color themes use JSONC: JSON syntax with comments and
          // optional trailing commas. Validate that format instead of feeding
          // the raw files directly to JSON.parse().
          const parseJsonc = (source) => {
            // Remove // and /* */ comments while preserving strings.
            let output = '';
            let inString = false;
            let escaped = false;
            let inLineComment = false;
            let inBlockComment = false;

            for (let i = 0; i < source.length; i++) {
              const char = source[i];
              const next = source[i + 1];

              if (inLineComment) {
                if (char === '\n') {
                  inLineComment = false;
                  output += char;
                }
                continue;
              }

              if (inBlockComment) {
                if (char === '*' && next === '/') {
                  inBlockComment = false;
                  i++;
                } else if (char === '\n') {
                  output += '\n';
                }
                continue;
              }

              if (inString) {
                output += char;
                if (escaped) {
                  escaped = false;
                } else if (char === '\\') {
                  escaped = true;
                } else if (char === '"') {
                  inString = false;
                }
                continue;
              }

              if (char === '"') {
                inString = true;
                output += char;
              } else if (char === '/' && next === '/') {
                inLineComment = true;
                i++;
              } else if (char === '/' && next === '*') {
                inBlockComment = true;
                i++;
              } else {
                output += char;
              }
            }

            // JSONC permits trailing commas; JSON.parse does not.
            output = output.replace(/,\s*([}\]])/g, '$1');
            return JSON.parse(output);
          };

          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            parseJsonc(source);
            console.log(`Validated ${file} as JSONC.`);
          }

          console.log(`Validated ${files.length} VS Code theme files as JSONC.`);
          NODE

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package extension
        run: vsce package
