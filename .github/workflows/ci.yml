name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate every registered theme and shared base
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const labels = new Set();
          for (const entry of pkg.contributes?.themes ?? []) {
            if (labels.has(entry.label)) throw new Error('Duplicate theme label: ' + entry.label);
            labels.add(entry.label);
            if (entry.uiTheme !== 'vs-dark') throw new Error('Unexpected UI theme: ' + entry.label);
            const file = path.resolve(entry.path);
            if (!fs.existsSync(file)) throw new Error('Theme file missing: ' + entry.path);
            const theme = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (theme.name !== entry.label) throw new Error('Theme name mismatch: ' + entry.label);
            if (theme.include) {
              const base = path.resolve(path.dirname(file), theme.include);
              if (!fs.existsSync(base)) throw new Error('Included base missing for ' + entry.label);
              JSON.parse(fs.readFileSync(base, 'utf8'));
            }
          }
          if (labels.size < 4) throw new Error('Expected at least four registered Ava Night editions.');
          if (pkg.license !== 'MIT') throw new Error('Expected the MIT license.');
          console.log('Validated ' + labels.size + ' registered theme editions.');
          NODE

      - name: Run theme diagnostics
        run: npm run diagnostics

      - name: Run theme quality checks
        run: npm run quality

      - name: Run accessibility and theme-family QA
        run: npm run qa

      - name: Run test suite
        run: npm test

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package extension
        run: vsce package --no-dependencies

      - name: Verify packaged theme editions
        run: npm run vsix:smoke

      - name: Install pinned VS Code runtime
        run: |
          curl -L --fail --retry 3 -o /tmp/code.deb https://update.code.visualstudio.com/1.100.0/linux-deb-x64/stable
          sudo apt-get update
          sudo apt-get install -y /tmp/code.deb xvfb

      - name: Find packaged VSIX
        id: package
        run: echo "path=$(pwd)/$(ls ava-night-*.vsix)" >> "$GITHUB_OUTPUT"

      - name: Run VS Code rendering smoke test
        env:
          CODE_BIN: code
          VSIX_PATH: ${{ steps.package.outputs.path }}
        run: npm run vscode:smoke

      - name: Upload VS Code smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ava-night-vscode-smoke
          path: tests/results/vscode-smoke-report.json
          if-no-files-found: warn
