name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate theme JSONC
        run: |
          node <<'NODE'
          const fs = require('fs');

          const files = [
            'themes/Ava Night-color-theme.json',
            'themes/Ava Night UI-refined-color-theme.json'
          ];

          // The VS Code theme format is JSON with comments (JSONC).
          // The theme files intentionally contain full-line comments, so
          // validate them as JSONC instead of passing raw JSON to JSON.parse.
          const stripJsoncComments = (source) =>
            source.replace(/^\s*\/\/.*$/gm, '');

          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const json = stripJsoncComments(source);
            JSON.parse(json);
          }

          console.log(`Validated ${files.length} theme files as JSONC.`);
          NODE

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package extension
        run: vsce package
