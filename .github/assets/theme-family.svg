<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" rx="28" fill="#0f1117"/><text x="58" y="70" fill="#d8dee9" font-size="32" font-family="Inter,Arial,sans-serif" font-weight="700">AVA NIGHT</text><text x="58" y="105" fill="#8b95a7" font-size="18" font-family="Inter,Arial,sans-serif">Four atmospheres. One focused coding experience.</text>
<g transform="translate(58 145)"><rect width="260" height="390" rx="18" fill="#131722" stroke="#242c3a"/><rect width="260" height="48" rx="18" fill="#0f1117"/><text x="18" y="30" fill="#d8dee9" font-size="16" font-family="Arial">01 · Midnight</text><rect x="18" y="75" width="224" height="270" rx="8" fill="#0f1117"/><g font-family="monospace" font-size="13"><text x="30" y="110" fill="#b48efa">const</text><text x="76" y="110" fill="#d8dee9"> night = {</text><text x="42" y="140" fill="#61afef">focus</text><text x="84" y="140" fill="#d8dee9">: true,</text><text x="42" y="170" fill="#61afef">mood</text><text x="80" y="170" fill="#98c379">: 'calm'</text><text x="30" y="200" fill="#d8dee9">};</text><text x="30" y="250" fill="#8b95a7">// quiet, clear, yours</text></g></g>
<g transform="translate(346 145)"><rect width="260" height="390" rx="18" fill="#101b22" stroke="#263b46"/><rect width="260" height="48" rx="18" fill="#0a141a"/><text x="18" y="30" fill="#d8e7ec" font-size="16" font-family="Arial">02 · Moonlit</text><rect x="18" y="75" width="224" height="270" rx="8" fill="#0a141a"/><g font-family="monospace" font-size="13"><text x="30" y="110" fill="#86b7e8">fn</text><text x="50" y="110" fill="#d8e7ec"> main() {</text><text x="42" y="140" fill="#78dce8">let</text><text x="70" y="140" fill="#d8e7ec"> glow =</text><text x="42" y="170" fill="#a8e6cf">"steady"</text><text x="30" y="200" fill="#d8e7ec">}</text><text x="30" y="250" fill="#91abb5">// breathe easy</text></g></g>
<g transform="translate(634 145)"><rect width="260" height="390" rx="18" fill="#1d1728" stroke="#3b2d4a"/><rect width="260" height="48" rx="18" fill="#140f1d"/><text x="18" y="30" fill="#e7dded" font-size="16" font-family="Arial">03 · Eclipse</text><rect x="18" y="75" width="224" height="270" rx="8" fill="#140f1d"/><g font-family="monospace" font-size="13"><text x="30" y="110" fill="#d6a5ff">class</text><text x="75" y="110" fill="#e7dded"> Eclipse {</text><text x="42" y="140" fill="#b99aff">const</text><text x="83" y="140" fill="#e7dded"> aura =</text><text x="42" y="170" fill="#a8e6cf">'violet'</text><text x="30" y="200" fill="#e7dded">}</text><text x="30" y="250" fill="#b2a0c1">// after the stars</text></g></g>
<g transform="translate(922 145)"><rect width="220" height="390" rx="18" fill="#151b19" stroke="#303f37"/><rect width="220" height="48" rx="18" fill="#0d1311"/><text x="18" y="30" fill="#dce9df" font-size="16" font-family="Arial">04 · Afterglow</text><rect x="14" y="75" width="192" height="270" rx="8" fill="#0d1311"/><g font-family="monospace" font-size="12"><text x="24" y="110" fill="#b9d9a8">const</text><text x="65" y="110" fill="#dce9df"> dawn = {</text><text x="34" y="140" fill="#9bd7c1">warmth</text><text x="78" y="140" fill="#dce9df">: true</text><text x="34" y="170" fill="#a8e6cf">light</text><text x="69" y="170" fill="#dce9df">: 0.8</text><text x="24" y="200" fill="#dce9df">};</text><text x="24" y="250" fill="#9ebaa8">// slowly, softly</text></g></g>
</svg>
